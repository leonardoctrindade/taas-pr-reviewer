trigger: none

pr:
  branches:
    include:
      - master
  paths:
    exclude:
      - azure-pipelines-pr-review.yml
      - review.py

pool:
  vmImage: 'windows-2022'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.11'

- task: CmdLine@2
  displayName: 'Revisao automatica de codigo'
  env:
    OPENROUTER_API_KEY: $(OPENROUTER_API_KEY)
    ADO_PAT: $(ADO_PAT)
    PR_ID: $(System.PullRequest.PullRequestId)
    REPO_ID: $(Build.Repository.ID)
    PR_TITLE: $(System.PullRequest.SourceBranch)
    AUTHOR: $(Build.RequestedFor)
    ORG: systaxsistemas
    PROJECT: TaxEngine
  script: python review.py
